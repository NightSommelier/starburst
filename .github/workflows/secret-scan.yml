name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks 敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
        with:
          fetch-depth: 0
      - name: 运行 gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo --config /repo/.gitleaks.toml --no-banner --redact
      # Complement to gitleaks: the repo's own rule set enforces private/CGNAT/link-local
      # IPs and URL-embedded credentials, while honouring RFC 5737 documentation ranges
      # and .secrets-allowlist. Runs on every push and PR, with no paths filter.
      - name: Run repository secret scan (check-secrets.sh)
        run: |
          chmod +x scripts/check-secrets.sh
          bash scripts/check-secrets.sh --all
