name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    # Docs-only pushes cannot change the APK; skip them for parity with
    # ci.yml (mirrors market .forgejo CI). Path filters are not evaluated
    # for pushes of tags, so release tags still always build.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'release-notes/**'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    # Write permission is required here (and only here): the last job steps
    # push the release tag and upload Release assets. Checkout keeps its
    # credentials for that tag push (persist-credentials must stay true).
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
        with:
          persist-credentials: true # required for `git push origin $TAG` below

      - name: Extract version from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed 's/.*versionName = "\(.*\)"/\1/')
          VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | head -1 | sed 's/.*versionCode = \([0-9]*\)/\1/')
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (code: $VERSION_CODE)"

      # Same JDK 17 temurin toolchain + gradle cache as ci.yml: Gradle 8.6
      # cannot run on newer toolchains, and the distribution must match CI.
      - name: Set up JDK 17
        uses: actions/setup-java@0ab4596768b603586c0de567f2430c30f5b0d2b0 # v3.13.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permissions for gradlew
        run: chmod +x ./gradlew

      - name: Validate release metadata
        env:
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Manual releases must run from main, not $GITHUB_REF_NAME"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version v$VERSION"
            exit 1
          fi
          MANIFEST_VERSION=$(python3 -c 'import json; print(json.load(open("update.json"))["versionName"])')
          MANIFEST_CODE=$(python3 -c 'import json; print(json.load(open("update.json"))["versionCode"])')
          MANIFEST_URL=$(python3 -c 'import json; print(json.load(open("update.json"))["releaseUrl"])')
          EXPECTED_URL="https://github.com/NightSommelier/starburst/releases/tag/v$VERSION"
          test "$MANIFEST_VERSION" = "$VERSION" || { echo "::error::update.json versionName mismatch"; exit 1; }
          test "$MANIFEST_CODE" = "$VERSION_CODE" || { echo "::error::update.json versionCode mismatch"; exit 1; }
          test "$MANIFEST_URL" = "$EXPECTED_URL" || { echo "::error::update.json releaseUrl mismatch"; exit 1; }

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Release signing secrets are required"
            exit 1
          fi
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          echo "keystore=keystore/release.keystore" > app/keystore/signing.properties
          echo "keystore.alias=$KEYSTORE_ALIAS" >> app/keystore/signing.properties
          echo "keystore.password=$KEYSTORE_PASSWORD" >> app/keystore/signing.properties

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p release-apks
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" release-apks/starburst-${VERSION}.apk
          else
            echo "::error::No APK found in app/build/outputs/apk/release/"
            exit 1
          fi

      - name: Verify APK and generate update manifest
        env:
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          APK="release-apks/starburst-${VERSION}.apk"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK" | head -1)
          APK_PACKAGE=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          APK_VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='\([^']*\)'.*/\1/p")
          APK_VERSION_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='[^']*' versionName='\([^']*\)'.*/\1/p")
          test "$APK_PACKAGE" = "org.hiylo.starburst" || { echo "::error::APK package mismatch"; exit 1; }
          test "$APK_VERSION_CODE" = "$VERSION_CODE" || { echo "::error::APK versionCode mismatch"; exit 1; }
          test "$APK_VERSION_NAME" = "$VERSION" || { echo "::error::APK versionName mismatch"; exit 1; }

          SHA256=$(sha256sum "$APK" | cut -d ' ' -f 1)
          export SHA256
          mkdir -p release-metadata
          python3 - <<'PY'
          import json
          import os

          version = os.environ["VERSION"]
          manifest = {
              "versionName": version,
              "versionCode": int(os.environ["VERSION_CODE"]),
              "releaseUrl": f"https://github.com/NightSommelier/starburst/releases/tag/v{version}",
              "packageName": "org.hiylo.starburst",
              "apkUrl": f"https://github.com/NightSommelier/starburst/releases/download/v{version}/starburst-{version}.apk",
              "sha256": os.environ["SHA256"],
          }
          with open("release-metadata/update.json", "w", encoding="utf-8") as output:
              json.dump(manifest, output, indent=2)
              output.write("\n")
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          TAG="v${VERSION}"

          # Never move an existing release tag to different code.
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)" || {
              echo "::error::Tag $TAG does not point to the workflow commit"
              exit 1
            }
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi

          # Upload the on-device model zip if it was placed in release-apks/ (manually,
          # e.g. as a large-file Release asset). It is intentionally not stored in the repo.
          MODEL_ASSET=""
          if [ -f "release-apks/starburst-model.zip" ]; then
            MODEL_ASSET="release-apks/starburst-model.zip"
          fi

          # Check if release already exists
          if gh release view $TAG > /dev/null 2>&1; then
            echo "Release $TAG already exists, uploading APK..."
            gh release upload "$TAG" release-apks/*.apk release-metadata/update.json $MODEL_ASSET --clobber
          else
            echo "Creating new release $TAG..."
            if [ -f "release-notes/RELEASE_NOTES_${VERSION}.md" ]; then
              gh release create $TAG \
                 --title "${VERSION}" \
                 --notes-file "release-notes/RELEASE_NOTES_${VERSION}.md" \
                 release-apks/*.apk release-metadata/update.json $MODEL_ASSET
            else
              gh release create $TAG \
                 --title "${VERSION}" \
                 --generate-notes \
                 release-apks/*.apk release-metadata/update.json $MODEL_ASSET
            fi
          fi

      - name: Remove signing material
        if: always()
        run: rm -f app/keystore/release.keystore app/keystore/signing.properties
